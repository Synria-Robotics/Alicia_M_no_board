[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "arx-m-can"
version = "0.1.0"
description = "ARX-M-CAN robot SDK — Rust core with Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.maturin]
manifest-path = "arx_m_can_py/Cargo.toml"
module-name = "_native"

[tool.pytest.ini_options]
pythonpath = ["."]
