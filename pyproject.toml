[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-d-can"
version = "0.1.0"
description = "Standalone ARX-D-CAN Python SDK for Damiao motors over USB2CAN."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "motorbridge",
  "numpy>=1.23",
  "pyserial==3.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
kinematics = [
  "robocore",
  "synriard",
  "scipy>=1.9",
]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arx_d_can*"]

[tool.setuptools.package-data]
arx_d_can = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
