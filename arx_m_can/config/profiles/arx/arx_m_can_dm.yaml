name: ARX-M-CAN

# Arm joint control: mit | posvel
arm_control_mode: mit

# Arm MIT gains tuned with gravity FF (see gravity_joint_scales.yaml).
# Per-joint step tune (recommended, one joint at a time):
#   python examples/13_mit_gain_autotune.py --robot arx --no-float tune --focus-joint 1 --mode step --write-yaml
# All joints j1→j6 (arm at a safe center pose first):
#   python examples/13_mit_gain_autotune.py --robot arx --no-float tune --write-yaml
# J6 at calibration ref:
#   python examples/13_mit_gain_autotune.py --robot arx --no-float tune --focus-joint 6 --goto-ref-pose --write-yaml

channel: /dev/ttyACM0
baud: 1000000
rate: 500

groups:
  arm:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  gripper:
    joints: [gripper]

gripper_mapping:
  closed_value: 0.0
  open_value: 3.0

gripper_button:
  motor_id: 0x08
  feedback_id: 0x208
  model: "4310"
  pmax: 12.5

joints:
  - name: joint1
    motor_id: 0x01
    feedback_id: 0x11
    model: "4340P"
    MIT:
      kp: 180.0
      kd: 4.5
    POS_VEL:
      vel_kp: 0.0125
      vel_ki: 0.004
      pos_kp: 150.0
      pos_ki: 0.5
      vlim: 5.0

  - name: joint2
    motor_id: 0x02
    feedback_id: 0x12
    model: "4340P"
    MIT:
      kp: 225.0
      kd: 2.0
    POS_VEL:
      vel_kp: 0.0125
      vel_ki: 0.004
      pos_kp: 150.0
      pos_ki: 0.5
      vlim: 5.0

  - name: joint3
    motor_id: 0x03
    feedback_id: 0x13
    model: "4340P"
    MIT:
      kp: 281.2
      kd: 4.5
    POS_VEL:
      vel_kp: 0.0125
      vel_ki: 0.004
      pos_kp: 150.0
      pos_ki: 0.5
      vlim: 5.0

  - name: joint4
    motor_id: 0x04
    feedback_id: 0x14
    model: "4310"
    MIT:
      kp: 114.8
      kd: 2.5
    POS_VEL:
      vel_kp: 0.0050
      vel_ki: 0.002
      pos_kp: 80.0
      pos_ki: 1.0
      vlim: 3.0

  - name: joint5
    motor_id: 0x05
    feedback_id: 0x15
    model: "4310"
    MIT:
      kp: 33.0
      kd: 1.2
    POS_VEL:
      vel_kp: 0.0008
      vel_ki: 0.002
      pos_kp: 50.0
      pos_ki: 1.0
      vlim: 3.0

  - name: joint6
    motor_id: 0x06
    feedback_id: 0x16
    model: "4310"
    MIT:
      kp: 54.0
      kd: 2.0
    POS_VEL:
      vel_kp: 0.0008
      vel_ki: 0.002
      pos_kp: 50.0
      pos_ki: 1.0
      vlim: 3.0

  - name: gripper
    motor_id: 0x07
    feedback_id: 0x17
    model: "4310"
    MIT:
      kp: 4.0
      kd: 0.5
    POS_VEL:
      vel_kp: 0.0008
      vel_ki: 0.002
      pos_kp: 50.0
      pos_ki: 1.0
      vlim: 3.0
